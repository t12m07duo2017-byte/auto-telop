[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-telop"
version = "0.1.0"
description = "台本+動画からAdobe Premiere Pro用の.prproj(テロップ・SE・画像入りタイムライン)を自動生成するCLIツール"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "faster-whisper>=1.0",
    "anthropic>=0.34",
    "Pillow>=10.0",
    "cryptography>=42.0",
]

[project.scripts]
auto-telop = "auto_telop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auto_telop = ["assets/*", "data/*"]
